<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>task6_3</title>
</head>

<body>
    <script>
        function rez(a,b,c){
            return (Number(a) - Number(b))/Number(c);
        };

        let num1 = prompt("Введите первое число: ");
        let num2 = prompt("Введите второе число: ");
        let num3 = prompt("Введите третье число: ");

        if (num1,num2,num3 != Number){
            alert('Введен неверный тип данных');
        }
        else {
            alert("Результат вычитания из первого числа второго и деления этого на третье равен: " + rez(num1,num2,num3));
        };

    </script>
</body>
</html>
