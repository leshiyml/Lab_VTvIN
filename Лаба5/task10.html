<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>task8</title>
</head>

<body>
    <script>
        
        let result = Number(prompt("Введите сумму зарплаты: "));

        alert("Премия 15%, сумма на руках: " + (result *= 1.15));
        alert("Налог 10%, сумма на руках: " + (result *= 0.9));
        alert("После траты в магазине 90 рублей, сумма на руках: " + (result -= 90));
        alert("Отдал половину жене, сумма на руках: " + (result /= 2));
        alert("Итоговая сумма которая осталась: " + result);


    </script>
</body>
</html>
