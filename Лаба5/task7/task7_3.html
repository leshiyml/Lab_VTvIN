<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>task7_3</title>
</head>

<body>
    <script>
        function is_true(a){
            if (a < 0){
                return true;
            }
            else{
                return false;
            }
        }

        let num1 = prompt("Введите число: ");

        alert("Отрицательное ли число " + num1 + "   -   " + is_true(num1))
    </script>
</body>
