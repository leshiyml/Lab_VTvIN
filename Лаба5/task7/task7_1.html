<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>task7_1</title>
</head>

<body>
    <script>
        function is_true(a,b){
            if (a === b){
                return true;
            }
            else{
                return false;
            }
        }

        let num1 = prompt("Введите первое число: ");
        let num2 = prompt("Введите второе число: ");

        alert("Равны ли числа " + num1 + " и " + num2 + "   -   " + is_true(num1,num2))
    </script>
</body>
</html>
