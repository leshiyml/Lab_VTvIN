<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Оформление HTML разметки</title>
</head>

<body>
  <main>

    <div class="intro">
      <header>
        <article class="slider-item">
          <p class="slider-subtitle"><span>New</span> ARRIVALS</p>
          <h1 class="slider-title">Sky Planter <sup>$18.00</sup></h1>
          <a class="slider-btn" href="#">Shop Now</a>
        </article>
      </header>
    </div>

    <div class="benefits">

      <article class="benefits-item">
        <img style="width: 5%;" class="img" src="task6.png" alt="Fast delivery">
        <h2 class="benefits-title">Fast delivery</h2>
        <p class="benefits-text">Same day delivery as soon as possible</p>
      </article>

      <article class="benefits-item">
        <img style="width: 5%;" class="img" src="task6.png" alt="Special discount">
        <h2 class="benefits-title">SPECIAL DISCOUNT</h2>
        <p class="benefits-text">Get attractive offers day by day</p>
      </article>

      <article class="benefits-item">
        <img style="width: 5%;" class="img" src="task6.png" alt="Secure checkout">
        <h2 class="benefits-title">SECURE CHECKOUT</h2>
        <p class="benefits-text">Fully secured SSL checkout technology</p>
      </article>

      <article class="benefits-item">
        <img style="width: 5%;" class="img" src="task6.png" alt="Money returns">
        <h2 class="benefits-title">MONEY RETURNS</h2>
        <p class="benefits-text">100% Money back guarantee</p>
      </article>

    </div>
    
  </main>

</html>
